<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>को मा को छ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f6efe0; --ink:#3a2f1f; --accent:#c0562b; --line:#d9c9a8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans Devanagari", system-ui, sans-serif; background:var(--paper); color:var(--ink); }
  .wrap { max-width:440px; margin:0 auto; padding:24px 16px 190px; }
  h1 { text-align:center; font-size:2.2rem; margin:8px 0 4px; }
  .sub { text-align:center; opacity:.7; margin-bottom:20px; }
  .card { background:#fffaf0; border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 2px 8px #0001; }
  label { display:block; font-weight:600; margin:16px 0 8px; }
  label:first-child { margin-top:0; }
  input[type=text], input[type=number] { width:100%; padding:12px; font-size:1.1rem; border:2px solid var(--line); border-radius:10px; background:#fff; font-family:inherit; color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .av { border:3px solid transparent; border-radius:50%; padding:0; background:none; cursor:pointer; aspect-ratio:1; }
  .av.sel { border-color:var(--accent); }
  .av svg, .av img { width:100%; height:100%; border-radius:50%; display:block; object-fit:cover; }
  .btn { display:block; width:100%; padding:13px; margin-top:12px; font-size:1.1rem; font-family:inherit; font-weight:600; border-radius:12px; border:2px solid var(--accent); cursor:pointer; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .primary { background:var(--accent); color:#fff; }
  .ghost { background:transparent; color:var(--accent); }
  .err { color:#b00020; min-height:1.2em; margin-top:8px; text-align:center; }
  .hidden { display:none !important; }
  .badge { text-align:center; font-size:.8rem; opacity:.6; margin-bottom:8px; }
  .me { display:flex; align-items:center; gap:14px; }
  .mini { width:64px; height:64px; flex:none; }
  .mini svg, .mini img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .link { color:var(--accent); cursor:pointer; text-decoration:underline; }
  .or { text-align:center; opacity:.6; margin:14px 0 6px; }
  .codein { text-align:center; letter-spacing:.3em; text-transform:uppercase; font-size:1.4rem !important; }
  .code { font-size:2.4rem; font-weight:700; letter-spacing:.2em; color:var(--accent); }
  .center { text-align:center; }
  .table { position:relative; width:100%; max-width:300px; height:340px; margin:8px auto; }
  .felt { position:absolute; left:50%; top:165px; width:130px; height:130px; transform:translate(-50%,-50%); border-radius:50%; background:#8b5a2b; box-shadow:inset 0 0 0 6px #6f4520; }
  .seat { position:absolute; transform:translate(-50%,-50%); width:84px; text-align:center; }
  .seatav { width:56px; height:56px; margin:0 auto 2px; }
  .seatav svg, .seatav img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .seatname { font-size:.8rem; font-weight:600; line-height:1.2; word-break:break-word; }
  .tag { font-size:.7rem; color:#fff; background:var(--accent); border-radius:8px; display:inline-block; padding:0 6px; margin-top:2px; }
  .row { display:flex; align-items:center; gap:10px; justify-content:center; margin-top:10px; }
  .row input { width:90px; text-align:center; }
  .small { font-size:.85rem; opacity:.7; }
  .holder { display:flex; align-items:center; gap:10px; justify-content:center; margin-top:6px; }
  .mini2 { width:48px; height:48px; margin:0 auto 2px; flex:none; }
  .holder .mini2 { margin:0; }
  .mini2 svg, .mini2 img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .paper { background:#fffdf3; border:1px solid var(--line); border-radius:8px; padding:6px 14px; margin:14px 0 10px; text-align:left; box-shadow:inset 4px 0 0 #e9b7a8; }
  .pline { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .pline:last-child { border-bottom:none; }
  .pline .lbl { font-size:1.25rem; font-weight:700; width:36px; }
  .pline > :first-child { flex:1; min-width:0; }
  .folded { height:36px; border-radius:6px; background:repeating-linear-gradient(45deg,#e6d9b8,#e6d9b8 6px,#f2e8cf 6px,#f2e8cf 12px); }
  .empty { height:36px; }
  .pline input { width:100%; padding:8px 10px; font-size:1.15rem; border:2px solid var(--accent); border-radius:8px; font-family:inherit; color:var(--ink); background:#fff; }
  .prompt { font-weight:600; margin:4px 0 2px; }
  .avrow { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:12px 0; }
  .avitem { text-align:center; width:70px; font-size:.78rem; word-break:break-word; }
  .sentence { background:#fffdf3; border:1px solid var(--line); border-radius:10px; padding:14px; font-size:1.25rem; line-height:1.9; margin-top:8px; }
  .sentence b { color:var(--accent); }
  #dock { position:fixed; left:0; right:0; bottom:0; z-index:20; max-width:440px; margin:0 auto; background:#fffaf0; border:1px solid var(--line); border-bottom:none; border-radius:16px 16px 0 0; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -4px 14px #0002; }
  #callRow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
  .ib { border:2px solid var(--accent); background:#fff; color:var(--accent); border-radius:12px; min-width:44px; height:44px; font-size:1.2rem; cursor:pointer; font-family:inherit; font-weight:600; padding:0 10px; }
  .ib.on { background:var(--accent); color:#fff; }
  .ib.join { flex:1; font-size:1rem; }
  .cv { position:relative; width:42px; height:42px; border-radius:50%; border:3px solid transparent; flex:none; }
  .cv.talk { border-color:#2f9e44; box-shadow:0 0 0 3px #2f9e4440; }
  .cv svg, .cv img { width:100%; height:100%; border-radius:50%; display:block; object-fit:cover; }
  .cv .mk { position:absolute; right:-8px; bottom:-8px; font-size:.8rem; }
  #reactPanel { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:8px; }
  .rx { border:1px solid var(--line); background:#fff; border-radius:10px; padding:4px 2px; font-family:inherit; cursor:pointer; font-size:1.5rem; line-height:1.1; color:var(--ink); }
  .rx span { display:block; font-size:.62rem; opacity:.7; }
  #vMsg { min-height:1em; margin-bottom:4px; font-size:.8rem; text-align:center; opacity:.8; }
  #floatLayer { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:30; }
  .fl { position:absolute; bottom:120px; text-align:center; animation:rise 2.4s ease-out forwards; }
  .fl .e { font-size:3rem; }
  .fl .n { font-size:.75rem; background:#0007; color:#fff; border-radius:8px; padding:1px 6px; }
  @keyframes rise { 0% { transform:translateY(0) scale(.6); opacity:0; } 15% { opacity:1; transform:translateY(-30px) scale(1.1); } 100% { transform:translateY(-280px) scale(1); opacity:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="badge" class="badge hidden"></div>
  <h1>को मा को छ</h1>
  <div id="loading" class="sub">जडान हुँदैछ...</div>

  <!-- PROFILE -->
  <div id="vProfile" class="hidden">
    <div class="sub">तपाईंको प्रोफाइल</div>
    <div class="card">
      <label for="name">प्रयोगकर्ता नाम</label>
      <input id="name" type="text" maxlength="16" placeholder="आफ्नो नाम लेख्नुहोस्" autocomplete="off">
      <label>अवतार छान्नुहोस्</label>
      <div id="grid" class="grid"></div>
      <label>वा आफ्नै फोटो राख्नुहोस्</label>
      <input id="file" type="file" accept="image/*" class="hidden">
      <button class="btn ghost" id="pick" style="margin-top:0">📷 फोटो छान्नुहोस्</button>
      <div id="err" class="err"></div>
      <button class="btn primary" id="save">सुरक्षित गर्नुहोस्</button>
    </div>
  </div>

  <!-- HOME -->
  <div id="vHome" class="hidden">
    <div class="card me">
      <div id="meAv" class="mini"></div>
      <div><b id="meName" style="font-size:1.2rem"></b><br><span class="link" id="edit">सम्पादन गर्नुहोस्</span></div>
    </div>
    <div class="card" style="margin-top:14px">
      <button class="btn primary" id="host" style="margin-top:0">रुम बनाउनुहोस् (होस्ट)</button>
      <div class="or">वा</div>
      <input id="code" type="text" class="codein" maxlength="5" placeholder="कोड" autocomplete="off">
      <button class="btn ghost" id="join">रुममा जानुहोस्</button>
      <div id="homeErr" class="err"></div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="vLobby" class="hidden">
    <div class="card center">
      <div>रुम कोड</div>
      <div id="roomCode" class="code"></div>
      <button class="btn ghost" id="copy" style="margin-top:4px">कोड कपी गर्नुहोस्</button>
      <div id="count" style="margin-top:14px;font-weight:600"></div>
      <div id="table" class="table"></div>
      <div class="row"><span>क्लेम ढिलाइ (सेकेन्ड)</span><input id="delayIn" type="number" min="5" max="120"></div>
      <button class="btn primary" id="start">सुरु गर्नुहोस्</button>
      <div id="lobbyMsg" class="err"></div>
      <button class="btn ghost" id="leave">रुम छोड्नुहोस्</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="vGame" class="hidden">
    <div class="card center">
      <div id="gHead" style="font-weight:700;font-size:1.1rem"></div>
      <div id="gBody"></div>
    </div>
  </div>
</div>

<div id="floatLayer"></div>
<div id="audioBox" style="position:absolute;width:0;height:0;overflow:hidden"></div>
<div id="dock" class="hidden">
  <div id="reactPanel" class="hidden"></div>
  <div id="vMsg"></div>
  <div id="callRow"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeAuth, signInAnonymously, browserSessionPersistence, indexedDBLocalPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, set, get, update, remove, onValue, serverTimestamp, push, onDisconnect, onChildAdded, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAkviCXXZdszqQFSeL_e_u2nmIsz9d8IWA",
  authDomain: "ko-maa-ko-chha.firebaseapp.com",
  databaseURL: "https://ko-maa-ko-chha-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ko-maa-ko-chha",
  storageBucket: "ko-maa-ko-chha.firebasestorage.app",
  messagingSenderId: "168994220920",
  appId: "1:168994220920:web:65f4d1f9bd82253c50368d"
};

const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search).get("player");
const SUF = P ? "_" + P : "";
const PK = "kmk_profile" + SUF;   // saved profile
const RK = "kmk_room" + SUF;      // last room
if (P) { $("badge").textContent = "Test player " + P; $("badge").classList.remove("hidden"); }

/* ---------- Avatars ---------- */
const AV = [
  {skin:"#f3cfa8", hair:"#2b1b12", style:"short",  bg:"#ffd9a8", shirt:"#3b6fb6"},
  {skin:"#e0ac84", hair:"#1a1a1a", style:"long",   bg:"#c9e4de", shirt:"#c0562b"},
  {skin:"#c68a5e", hair:"#1a1a1a", style:"curly",  bg:"#f7d9e3", shirt:"#2f855a"},
  {skin:"#8d5a3b", hair:"#111111", style:"short",  bg:"#dbe2ef", shirt:"#6b46c1", glasses:true},
  {skin:"#f3cfa8", hair:"#8a4b2a", style:"bun",    bg:"#fde2b8", shirt:"#d69e2e"},
  {skin:"#e0ac84", hair:"#2b1b12", style:"topi",   bg:"#cfe8ff", shirt:"#e8e1d0", cap:"#d7a43a"},
  {skin:"#c68a5e", hair:"#2b1b12", style:"short",  bg:"#e6d5f2", shirt:"#2b6cb0", beard:true},
  {skin:"#f3cfa8", hair:"#e0b44c", style:"long",   bg:"#d4f0d0", shirt:"#e53e3e"},
  {skin:"#8d5a3b", hair:"#111111", style:"curly",  bg:"#ffe3c2", shirt:"#38a169", glasses:true},
  {skin:"#e0ac84", hair:"#444444", style:"bald",   bg:"#d9e8f7", shirt:"#805ad5", beard:true},
  {skin:"#f3cfa8", hair:"#1a1a1a", style:"cap",    bg:"#f9d7d7", shirt:"#2c7a7b", cap:"#2b6cb0"},
  {skin:"#c68a5e", hair:"#6b3a1e", style:"bun",    bg:"#e2f0cb", shirt:"#b83280"}
];
function avatarSVG(a) {
  let back = "", front = "", extra = "";
  if (a.style === "long") back = `<rect x="25" y="28" width="50" height="52" rx="22" fill="${a.hair}"/>`;
  const top = `<path d="M28 46 Q28 22 50 22 Q72 22 72 46 Q66 34 50 34 Q34 34 28 46Z" fill="${a.hair}"/>`;
  if (a.style === "short" || a.style === "long") front = top;
  if (a.style === "bun") front = top + `<circle cx="50" cy="17" r="9" fill="${a.hair}"/>`;
  if (a.style === "curly") front = [[30,38],[38,28],[50,24],[62,28],[70,38]].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="${a.hair}"/>`).join("");
  if (a.style === "cap") front = `<path d="M27 44 Q27 20 50 20 Q73 20 73 44Z" fill="${a.cap}"/><rect x="25" y="42" width="50" height="5" rx="2" fill="${a.cap}"/>`;
  if (a.style === "topi") front = `<path d="M29 40 L31 22 L69 22 L71 40 Q50 33 29 40Z" fill="${a.cap}"/><path d="M31 30 L69 30" stroke="#8a5a1a" stroke-width="2"/>`;
  if (a.beard) extra += `<path d="M30 54 Q32 76 50 76 Q68 76 70 54 Q60 67 50 67 Q40 67 30 54Z" fill="${a.hair}"/>`;
  if (a.glasses) extra += `<circle cx="42" cy="48" r="6.5" fill="none" stroke="#222" stroke-width="2"/><circle cx="58" cy="48" r="6.5" fill="none" stroke="#222" stroke-width="2"/><path d="M48.5 48 H51.5" stroke="#222" stroke-width="2"/>`;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="${a.bg}"/>${back}
    <path d="M14 100 Q18 76 50 74 Q82 76 86 100Z" fill="${a.shirt}"/>
    <rect x="44" y="64" width="12" height="14" fill="${a.skin}"/>
    <circle cx="50" cy="48" r="22" fill="${a.skin}"/>${front}
    <circle cx="42" cy="48" r="2.4" fill="#222"/><circle cx="58" cy="48" r="2.4" fill="#222"/>
    <path d="M42 58 Q50 65 58 58" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>${extra}</svg>`;
}
const PHOTO_OK = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
function picHTML(p) {
  if (p && p.photo && PHOTO_OK.test(p.photo)) return `<img src="${p.photo}" alt="">`;
  return avatarSVG(AV[p && p.avatar] || AV[0]);
}
const norm = x => { const o = {}; if (x) Object.keys(x).forEach(k => { if (x[k] !== null && x[k] !== undefined) o[k] = x[k]; }); return o; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sortedPlayers = room => Object.entries(room.players || {}).map(([id, p]) => ({ id, ...p })).sort((a, b) => Number(a.seat) - Number(b.seat));

/* ---------- Views ---------- */
function show(id) {
  ["vProfile", "vHome", "vLobby", "vGame", "loading"].forEach(v => $(v).classList.add("hidden"));
  if (id) $(id).classList.remove("hidden");
  const d = $("dock"); if (d) d.classList.toggle("hidden", !(id === "vLobby" || id === "vGame"));
}

/* ---------- Firebase ---------- */
let db, uid;
try {
  const app = initializeApp(firebaseConfig, P ? "p" + P : undefined);
  const auth = initializeAuth(app, { persistence: P ? browserSessionPersistence : [indexedDBLocalPersistence, browserLocalPersistence] });
  await auth.authStateReady();
  if (!auth.currentUser) await signInAnonymously(auth);
  uid = auth.currentUser.uid;
  db = getDatabase(app);
} catch (e) {
  $("loading").textContent = "❌ जडान भएन: " + e.message;
  throw e;
}

/* ---------- Profile ---------- */
let profile = { name: "", avatar: 0, photo: null };
try { const s = JSON.parse(localStorage.getItem(PK)); if (s && s.name) profile = Object.assign(profile, s); } catch (e) {}
let draft = { ...profile };

function drawGrid() {
  const g = $("grid"); g.innerHTML = "";
  if (draft.photo) {
    const b = document.createElement("button"); b.className = "av sel";
    b.innerHTML = `<img src="${draft.photo}" alt="">`; g.appendChild(b);
  }
  AV.forEach((a, i) => {
    const b = document.createElement("button");
    b.className = "av" + (!draft.photo && draft.avatar === i ? " sel" : "");
    b.innerHTML = avatarSVG(a);
    b.onclick = () => { draft.avatar = i; draft.photo = null; drawGrid(); };
    g.appendChild(b);
  });
}
function showProfileForm() {
  draft = { ...profile };
  $("name").value = draft.name; $("err").textContent = "";
  drawGrid(); show("vProfile");
}
$("pick").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const s = Math.min(img.width, img.height), c = document.createElement("canvas");
    c.width = c.height = 128;
    c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
    draft.photo = c.toDataURL("image/jpeg", 0.8);
    URL.revokeObjectURL(url); drawGrid();
  };
  img.onerror = () => { $("err").textContent = "फोटो खुल्न सकेन, अर्को छान्नुहोस्।"; };
  img.src = url;
};
$("save").onclick = () => {
  const n = $("name").value.trim();
  if (!n) { $("err").textContent = "कृपया नाम लेख्नुहोस्।"; return; }
  draft.name = n; profile = { ...draft };
  try { localStorage.setItem(PK, JSON.stringify(profile)); } catch (e) {}
  renderHome();
};
$("edit").onclick = showProfileForm;

/* ---------- Home ---------- */
function renderHome() {
  $("meAv").innerHTML = picHTML(profile);
  $("meName").textContent = profile.name;
  $("homeErr").textContent = ""; $("code").value = "";
  show("vHome");
}
const CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const makeCode = () => Array.from({ length: 5 }, () => CHARS[Math.floor(Math.random() * CHARS.length)]).join("");

async function joinRoom(code) {
  const m = await get(ref(db, `rooms/${code}/meta`));
  if (!m.exists()) throw "nocode";
  const mine = ref(db, `rooms/${code}/players/${uid}`);
  const ex = await get(mine);
  if (!ex.exists()) {
    let seat = null;
    for (let i = 0; i < 4; i++) {
      try { await set(ref(db, `rooms/${code}/seats/${i}`), uid); seat = String(i); break; } catch (e) {}
    }
    if (seat === null) throw "full";
    const pl = { name: profile.name, avatar: profile.avatar, seat };
    if (profile.photo) pl.photo = profile.photo;
    try { await set(mine, pl); }
    catch (e) { try { await remove(ref(db, `rooms/${code}/seats/${seat}`)); } catch (e2) {} throw "full"; }
  }
  enterLobby(code);
}
$("host").onclick = async () => {
  $("homeErr").textContent = "";
  for (let i = 0; i < 5; i++) {
    const code = makeCode();
    try {
      await set(ref(db, `rooms/${code}/meta`), { host: uid, status: "lobby", claimDelay: 30, createdAt: serverTimestamp() });
    } catch (e) { continue; }
    try { await joinRoom(code); } catch (e) { $("homeErr").textContent = "रुममा जान सकिएन।"; }
    return;
  }
  $("homeErr").textContent = "रुम बनाउन सकिएन। (Firebase rules पेस्ट गर्नुभयो?)";
};
$("join").onclick = async () => {
  const code = $("code").value.trim().toUpperCase();
  if (code.length !== 5) { $("homeErr").textContent = "५ अक्षरको कोड हाल्नुहोस्।"; return; }
  $("homeErr").textContent = "";
  try { await joinRoom(code); }
  catch (e) { $("homeErr").textContent = e === "nocode" ? "कोड मिलेन।" : "रुम भरिएको छ वा खेल सुरु भइसकेको छ।"; }
};

/* ---------- Lobby ---------- */
let unsub = null, curCode = null;
let viewKey = null, lastRoom = null, gameErr = "", draftWord = "", busy = false;
function enterLobby(code) {
  curCode = code; viewKey = null; gameErr = ""; draftWord = ""; lastRoom = null; resetReveal();
  try { localStorage.setItem(RK, code); } catch (e) {}
  $("roomCode").textContent = code; $("lobbyMsg").textContent = "";
  show("loading");
  startReactListener(code);
  if (unsub) unsub();
  unsub = onValue(ref(db, "rooms/" + code),
    s => {
      const v = s.val();
      if (!v || !v.players || !v.players[uid]) { goHome(); return; }
      lastRoom = v;
      if ((v.meta || {}).status === "lobby") { viewKey = null; resetReveal(); show("vLobby"); renderLobby(v); }
      else renderGame(v);

/* ---------- Game ---------- */
const LBL = ["को", "मा", "को", "छ"];
const KIND = ["नाम", "अंग", "नाम", "अंग"];
const PROMPT = ["", "", "", ""];

function gameState(room) {
  const plan = norm(room.plan), passed = room.passed || {};
  const papers = Object.keys(plan).map(Number).sort((a, b) => a - b);
  const planOf = (p, b) => { const x = plan[p]; return x ? x[b] : undefined; };
  const members = papers.map(p => planOf(p, 0));
  const has = (b, u) => { const x = passed[b]; return !!x && x[u] !== undefined && x[u] !== null; };
  let round = 4;
  for (let b = 0; b < 4; b++) { if (!members.every(u => has(b, u))) { round = b; break; } }
  return { papers, planOf, members, has, round };
}

function renderGame(room) {
  const S = gameState(room);
  show("vGame");
  if (!S.members.includes(uid)) { viewKey = null; $("gHead").textContent = ""; $("gBody").textContent = "खेल सुरु भइसकेको छ।"; return; }
  if (S.round >= 4) { renderReveal(room, S); return; }
  const r = S.round;
  $("gHead").textContent = `राउन्ड ${r + 1} / 4`;
  if (S.has(r, uid)) renderWaiting(room, S, r); else renderWriting(room, S, r);
}

function renderWriting(room, S, r) {
  const p = S.papers.find(q => S.planOf(q, r) === uid);
  const key = `w:${r}:${p}`;
  if (viewKey === key) return;
  viewKey = key;
  const owner = (room.players || {})[S.planOf(p, 0)] || { name: "?", avatar: 0 };
  let lines = "";
  for (let b = 0; b < 4; b++) {
    let mid;
    if (b < r) mid = '<div class="folded"></div>';
    else if (b === r) mid = `<input id="wordIn" type="text" maxlength="20" autocomplete="off" placeholder="" value="${esc(draftWord)}">`;
    else mid = '<div class="empty"></div>';
    lines += `<div class="pline">${mid}<span class="lbl">${LBL[b]}</span></div>`;
  }
  $("gBody").innerHTML = `<div class="holder"><div class="mini2">${picHTML(owner)}</div><div><span class="small">कागज:</span> <b>${esc(owner.name)}</b></div></div>
    <div class="paper">${lines}</div>
    <div class="prompt">${PROMPT[r]}</div>
    <button class="btn primary" id="pass">पास गर्नुहोस्</button>
    <div id="gErr" class="err">${esc(gameErr)}</div>`;
  draftWord = "";
  $("pass").onclick = () => submitWord(r, p);
  $("wordIn").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) submitWord(r, p); };
  setTimeout(() => { const i = $("wordIn"); if (i) i.focus(); }, 50);
}

async function submitWord(r, p) {

/* ---------- Reveal ---------- */
let sentCache = {}, sentBusy = {}, sentTry = {}, sentFail = {}, offset = 0, pickOpen = false, rv = { active: null, startAt: 0, delayMs: 0 };

async function ensureSentence(p) {

  try {
    const v = norm((await get(ref(db, `words/${curCode}/${p}`))).val());

}

function revealState(room, S) {

  const active = q.length ? q[0] : null;
  const lastDone = Math.max(0, ...Object.values(all).map(Number));
  const delayMs = ((room.meta || {}).claimDelay || 30) * 1000;
  const startAt = active === null ? 0 : Math.max(Number(opened[active]), lastDone);
  return { opened, all, shareTo, active, startAt, delayMs, allDone: S.papers.every(p => all[p] !== undefined) };
}

function renderReveal(room, S) {

/* ---------- Voice call + reactions ---------- */
const TURN = { app: "", key: "" };   // रिले चाहिएमा: Metered को app नाम र API key यहाँ राख्ने
const vc = { on: false, joining: false, stream: null, ctx: null, sid: "", code: null, pcs: {}, members: {}, meters: {}, seen: new Set(), muted: false, unsubM: null, unsubS: null, ice: null };
window.__vc = vc;
let unsubR = null, soundOn = true, sfx = null, lastRx = 0, sigQueue = Promise.resolve();
try { soundOn = localStorage.getItem("kmk_sound" + SUF) !== "0"; } catch (e) {}

async function loadIce() {
  const base = [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }];
  if (TURN.app && TURN.key) {
    try {
      const r = await fetch(`https://${TURN.app}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(TURN.key)}`);
      const j = await r.json();
      if (Array.isArray(j)) return { iceServers: base.concat(j) };
    } catch (e) {}
  }
  return { iceServers: base };
}
const vMsg = t => { $("vMsg").textContent = t || ""; };

async function joinCall() {
  if (vc.on || vc.joining || !curCode) return;
  vc.joining = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { vMsg("यो ब्राउजरमा माइक चल्दैन।"); vc.joining = false; return; }
  try {
    vc.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
  } catch (e) { vMsg("माइक चल्न सकेन — ब्राउजरमा माइकको अनुमति दिनुहोस्।"); vc.joining = false; return; }
  vMsg("");
  const AC = window.AudioContext || window.webkitAudioContext;
  vc.ctx = new AC(); vc.ctx.resume().catch(() => {});
  vc.sid = Math.random().toString(36).slice(2, 10);
  vc.code = curCode; vc.muted = false; vc.seen = new Set(); vc.meters = {}; vc.members = {};
  vc.ice = await loadIce();
  const code = vc.code;
  try { await remove(ref(db, `voice/${code}/sig/${uid}`)); } catch (e) {}
  const mref = ref(db, `voice/${code}/members/${uid}`);
  try { onDisconnect(mref).remove(); } catch (e) {}
  vc.on = true; vc.joining = false;
  addMeter(uid, vc.stream);
  try { await set(mref, { sid: vc.sid, muted: false }); }
  catch (e) { vMsg("कलमा जोड्न सकिएन। (नयाँ Firebase rules पेस्ट गर्नुभयो?)"); await leaveCall(); return; }
  vc.unsubM = onValue(ref(db, `voice/${code}/members`), s => onMembers(norm(s.val())));
  vc.unsubS = onValue(ref(db, `voice/${code}/sig/${uid}`), s => onSignals(s.val()));
  renderDock();
}

async function leaveCall() {
  if (!vc.on) return;
  vc.on = false;
  const code = vc.code;
  Object.keys(vc.pcs).forEach(closePeer);
  if (vc.stream) vc.stream.getTracks().forEach(t => t.stop());
  vc.stream = null; vc.meters = {}; vc.members = {}; vc.seen = new Set();
  if (vc.unsubM) vc.unsubM(); if (vc.unsubS) vc.unsubS();
  vc.unsubM = vc.unsubS = null;
  try { if (vc.ctx) vc.ctx.close(); } catch (e) {}
  vc.ctx = null;
  try { await remove(ref(db, `voice/${code}/members/${uid}`)); } catch (e) {}
  renderDock();
}

function setMuted(m) {
  vc.muted = m;
  if (vc.stream) vc.stream.getAudioTracks().forEach(t => { t.enabled = !m; });
  update(ref(db, `voice/${vc.code}/members/${uid}`), { muted: m }).catch(() => {});
  renderDock();
}

function addMeter(u, stream) {
  try {
    const src = vc.ctx.createMediaStreamSource(stream), an = vc.ctx.createAnalyser();
    an.fftSize = 512; src.connect(an);
    const buf = new Uint8Array(an.fftSize);
    vc.meters[u] = { level() { an.getByteTimeDomainData(buf); let t = 0; for (let i = 0; i < buf.length; i++) { const x = (buf[i] - 128) / 128; t += x * x; } return Math.sqrt(t / buf.length); } };
  } catch (e) {}
}

function createPeer(u, sid) {
  const pc = new RTCPeerConnection(vc.ice);
  const peer = { pc, sid, pending: [], remoteSet: false, tries: 0, audio: null };
  vc.stream.getTracks().forEach(t => pc.addTrack(t, vc.stream));
  pc.onicecandidate = e => { if (e.candidate) sendSig(u, peer, "ice", JSON.stringify(e.candidate)); };
  pc.ontrack = e => attachRemote(u, peer, e.streams[0] || new MediaStream([e.track]));
  pc.onconnectionstatechange = () => {
    renderDock();
    if (pc.connectionState === "failed" && uid < u && peer.tries < 3) {
      setTimeout(() => { if (vc.on && vc.pcs[u] === peer) { peer.tries++; makeOffer(u, true); } }, 1500);
    }
  };
  vc.pcs[u] = peer;
  return peer;
}
function closePeer(u) {
  const p = vc.pcs[u]; if (!p) return;
  try { p.pc.close(); } catch (e) {}
  if (p.audio) p.audio.remove();
  delete vc.meters[u]; delete vc.pcs[u];
}
function attachRemote(u, peer, stream) {
  if (peer.audio) peer.audio.remove();
  const a = document.createElement("audio");
  a.autoplay = true; a.playsInline = true; a.srcObject = stream;
  $("audioBox").appendChild(a); peer.audio = a;
  a.play().catch(() => {
    vMsg("आवाज सुन्न स्क्रिनमा एक पटक थिच्नुहोस्।");
    document.addEventListener("pointerdown", () => { document.querySelectorAll("#audioBox audio").forEach(x => x.play().catch(() => {})); vMsg(""); }, { once: true });
  });
  addMeter(u, stream);
}
function sendSig(u, peer, t, d) {
  set(push(ref(db, `voice/${vc.code}/sig/${u}/${uid}`)), { sid: vc.sid, tsid: peer.sid, t, d }).catch(() => {});
}
async function makeOffer(u, restart) {
  const peer = vc.pcs[u]; if (!peer) return;
  try {
    const offer = await peer.pc.createOffer({ iceRestart: !!restart });
    await peer.pc.setLocalDescription(offer);
    sendSig(u, peer, "offer", JSON.stringify(peer.pc.localDescription));
  } catch (e) {}
}
async function flushIce(peer) {
  peer.remoteSet = true;
  for (const c of peer.pending.splice(0)) { try { await peer.pc.addIceCandidate(c); } catch (e) {} }
}

function onMembers(members) {
  if (!vc.on) return;
  vc.members = members;
  for (const [u, m] of Object.entries(members)) {
    if (u === uid || !m || !m.sid) continue;
    const cur = vc.pcs[u];
    if (cur && cur.sid !== m.sid) closePeer(u);
    if (!vc.pcs[u]) { createPeer(u, m.sid); if (uid < u) makeOffer(u, false); }
  }
  Object.keys(vc.pcs).forEach(u => { if (!members[u]) closePeer(u); });
  renderDock();
}

function onSignals(val) {
  if (!vc.on) return;
  const msgs = [];
  Object.entries(norm(val)).forEach(([from, byId]) => Object.entries(norm(byId)).forEach(([id, m]) => {
    if (!vc.seen.has(id)) { vc.seen.add(id); msgs.push({ from, id, m }); }
  }));
  msgs.sort((a, b) => (a.id < b.id ? -1 : 1));
  msgs.forEach(x => { sigQueue = sigQueue.then(() => handleSig(x)).catch(() => {}); });
}
async function handleSig({ from, id, m }) {
  remove(ref(db, `voice/${vc.code}/sig/${uid}/${from}/${id}`)).catch(() => {});
  if (!vc.on || !m || m.tsid !== vc.sid) return;
  let peer = vc.pcs[from];
  if (m.t === "offer") {
    if (!peer || peer.sid !== m.sid) { if (peer) closePeer(from); peer = createPeer(from, m.sid); }
    await peer.pc.setRemoteDescription(JSON.parse(m.d));
    await flushIce(peer);
    const ans = await peer.pc.createAnswer();
    await peer.pc.setLocalDescription(ans);
    sendSig(from, peer, "answer", JSON.stringify(peer.pc.localDescription));
  } else if (!peer || peer.sid !== m.sid) {
    return;
  } else if (m.t === "answer") {
    await peer.pc.setRemoteDescription(JSON.parse(m.d));
    await flushIce(peer);
  } else if (m.t === "ice") {
    const c = JSON.parse(m.d);
    if (peer.remoteSet) { try { await peer.pc.addIceCandidate(c); } catch (e) {} } else peer.pending.push(c);
  }
}

/* ----- dock (call bar) ----- */
function renderDock() {
  const row = $("callRow"); if (!row) return;
  let h = "";
  if (!vc.on) h += '<button class="ib join" id="joinCall">🎤 कलमा जोडिनुहोस्</button>';
  else {
    const list = (lastRoom ? sortedPlayers(lastRoom) : []).filter(p => vc.members[p.id]);
    h += list.map(p => {
      const m = vc.members[p.id], pr = vc.pcs[p.id];
      let mark = m.muted ? "🔇" : "";
      if (p.id !== uid && !mark && (!pr || pr.pc.connectionState !== "connected")) mark = pr && pr.pc.connectionState === "failed" ? "⚠️" : "⏳";
      return `<div class="cv" data-u="${esc(p.id)}" title="${esc(p.name)}">${picHTML(p)}${mark ? `<span class="mk">${mark}</span>` : ""}</div>`;
    }).join("");
    h += `<button class="ib${vc.muted ? "" : " on"}" id="muteBtn" title="माइक">${vc.muted ? "🔇" : "🎤"}</button>`;
  }
  h += '<button class="ib" id="rxBtn" title="रिएक्सन">😂</button>';
  h += `<button class="ib" id="sndBtn" title="रिएक्सनको आवाज">${soundOn ? "🔔" : "🔕"}</button>`;
  if (vc.on) h += '<button class="ib" id="leaveCall" title="कल छोड्नुहोस्">📞✖</button>';
  row.innerHTML = h;
  if (!vc.on && !$("vMsg").textContent) vMsg("ईयरफोन लगाउनुहोस् 🎧");
  if ($("joinCall")) $("joinCall").onclick = joinCall;
  if ($("muteBtn")) $("muteBtn").onclick = () => setMuted(!vc.muted);
  if ($("leaveCall")) $("leaveCall").onclick = leaveCall;
  $("rxBtn").onclick = () => $("reactPanel").classList.toggle("hidden");
  $("sndBtn").onclick = () => {
    soundOn = !soundOn;
    try { localStorage.setItem("kmk_sound" + SUF, soundOn ? "1" : "0"); } catch (e) {}
    renderDock();
  };
}
setInterval(() => {
  document.querySelectorAll("#callRow .cv").forEach(el => {
    const u = el.dataset.u, mt = vc.meters[u];
    el.classList.toggle("talk", !!mt && mt.level() > 0.02 && !(u === uid && vc.muted));
  });
}, 150);

/* ----- reactions ----- */
const REACTS = [
  ["haha", "😂", "हाहा"], ["laugh", "🤣", "मरेँ हाँसेर"], ["rage", "😡", "रिस"], ["shy", "🙈", "लाज"],
  ["shock", "😱", "अचम्म"], ["cry", "😭", "रुवाइ"], ["palm", "🤦", "हे भगवान"], ["clap", "👏", "ताली"],
  ["love", "😍", "माया"], ["confused", "🥴", "के भो?"], ["savage", "🔥", "ज्वाला"], ["dead", "💀", "मरिसकेँ"],
  ["boring", "😴", "बोरिङ"], ["oops", "🤭", "ओहो"], ["boo", "👎", "बू!"], ["drum", "🥁", "बा-डम-ट्स"]
];
$("reactPanel").innerHTML = REACTS.map(r => `<button class="rx" data-k="${r[0]}">${r[1]}<span>${r[2]}</span></button>`).join("");
$("reactPanel").onclick = e => { const b = e.target.closest(".rx"); if (b) sendReact(b.dataset.k); };

function sendReact(k) {
  const t = Date.now();
  if (t - lastRx < 700 || !curCode) return;
  lastRx = t;
  set(push(ref(db, `rooms/${curCode}/react`)), { u: uid, k, t: serverTimestamp() }).catch(() => {});
}
function startReactListener(code) {
  if (unsubR) unsubR();
  unsubR = onChildAdded(query(ref(db, `rooms/${code}/react`), limitToLast(10)), s => {
    const v = s.val();
    if (!v || typeof v.t !== "number" || nowMs() - v.t > 6000) return;
    showFloat(v.u, v.k); playSound(v.k);
  });
}
function showFloat(u, k) {
  const r = REACTS.find(x => x[0] === k); if (!r) return;
  const L = $("floatLayer"); while (L.children.length > 12) L.removeChild(L.firstChild);
  const pl = lastRoom && lastRoom.players && lastRoom.players[u];
  const d = document.createElement("div"); d.className = "fl";
  d.style.left = (8 + Math.random() * 70) + "%";
  d.innerHTML = `<div class="e">${r[1]}</div><div class="n"></div>`;
  d.querySelector(".n").textContent = pl ? pl.name : "";
  L.appendChild(d); setTimeout(() => d.remove(), 2500);
}

/* ----- sounds (generated in the browser, no files) ----- */
function sfxCtx() {
  if (!sfx) { try { sfx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (sfx && sfx.state === "suspended") sfx.resume().catch(() => {});
  return sfx;
}
document.addEventListener("pointerdown", () => sfxCtx(), { once: true });
const SND = {
  haha: T => { for (let i = 0; i < 4; i++) T(300 - i * 18, i * 0.16, 0.11, "sawtooth", 0.5, 260 - i * 18, 1000); },
  laugh: T => { for (let i = 0; i < 8; i++) T(380 + i * 12, i * 0.1, 0.07, "sawtooth", 0.5, 330 + i * 12, 1500); T(520, 0.85, 0.25, "sine", 0.3, 380); },
  rage: (T, N) => { T(90, 0, 0.7, "sawtooth", 0.6, 160, 500); N(0, 0.5, 0.4, 400, 0.7); T(70, 0.1, 0.6, "square", 0.25, 140, 300); },
  shy: T => { T(700, 0, 0.18, "sine", 0.35, 880); T(880, 0.18, 0.25, "sine", 0.3, 700); },
  shock: (T, N) => { T(300, 0, 0.35, "sawtooth", 0.4, 1400, 2500); N(0.3, 0.25, 0.4, 3000, 0.5); },
  cry: T => { T(650, 0, 0.45, "sine", 0.4, 420); T(600, 0.5, 0.5, "sine", 0.4, 330); T(300, 0.1, 0.9, "sine", 0.12, 280); },
  palm: (T, N) => { N(0, 0.12, 0.9, 1200, 0.8); T(140, 0, 0.18, "sine", 0.8, 70); },
  clap: (T, N) => { [0, 0.09, 0.18, 0.3, 0.4, 0.5, 0.62].forEach(s => N(s, 0.07, 0.8, 1900, 0.9)); },
  love: T => { [523, 659, 784, 1047].forEach((f, i) => T(f, i * 0.09, 0.28, "triangle", 0.4)); },
  confused: T => { T(400, 0, 0.25, "sine", 0.4, 560); T(560, 0.25, 0.25, "sine", 0.4, 380); T(380, 0.5, 0.3, "sine", 0.4, 520); },
  savage: T => { T(440, 0, 0.35, "sawtooth", 0.35, 415, 1800); T(554, 0, 0.35, "sawtooth", 0.3, 520, 1800); T(659, 0, 0.35, "sawtooth", 0.3, 620, 1800); },
  dead: T => { T(311, 0, 0.3, "sawtooth", 0.4, 305, 900); T(294, 0.33, 0.3, "sawtooth", 0.4, 288, 900); T(277, 0.66, 0.3, "sawtooth", 0.4, 270, 900); T(262, 1.0, 0.8, "sawtooth", 0.4, 200, 900); },
  boring: T => { T(520, 0, 0.8, "sine", 0.4, 110); },
  oops: T => { T(220, 0, 0.12, "square", 0.25, 700, 2000); T(700, 0.12, 0.25, "sine", 0.35, 260); },
  boo: T => { T(160, 0, 1, "sawtooth", 0.5, 120, 420); T(80, 0, 1, "sine", 0.35, 70); },
  drum: (T, N) => { T(180, 0, 0.1, "sine", 0.9, 90); T(140, 0.18, 0.12, "sine", 0.9, 70); N(0.4, 0.5, 0.5, 7000, 0.5); }
};
function playSound(kind, c0) {
  if (!soundOn || !SND[kind]) return;
  (window.__sounds = window.__sounds || []).push(kind);
  const c = c0 || sfxCtx(); if (!c || (!c0 && c.state !== "running")) return;
  const t0 = c.currentTime + 0.02, out = c.createGain();
  out.gain.value = 0.35; out.connect(c.destination);
  const T = (f, s, d, type, v, f2, lp) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0 + s);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + s + d);
    g.gain.setValueAtTime(0.0001, t0 + s);
    g.gain.exponentialRampToValueAtTime(v, t0 + s + Math.min(0.02, d / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + s + d);
    let node = o;
    if (lp) { const flt = c.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = lp; o.connect(flt); node = flt; }
    node.connect(g); g.connect(out); o.start(t0 + s); o.stop(t0 + s + d + 0.05);
  };
  const N = (s, d, v, bp, q) => {
    const len = Math.max(1, Math.floor(c.sampleRate * d)), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; flt.type = "bandpass"; flt.frequency.value = bp; flt.Q.value = q; g.gain.value = v;
    src.connect(flt); flt.connect(g); g.connect(out); src.start(t0 + s);
  };
  try { SND[kind](T, N); } catch (e) {}
}

window.__playSound = playSound;

/* ---------- Start ---------- */
(async () => {
  if (!profile.name) { showProfileForm(); return; }
  let rc = null;
  try { rc = localStorage.getItem(RK); } catch (e) {}
  if (rc) {
    try {
      const ex = await get(ref(db, `rooms/${rc}/players/${uid}`));
      if (ex.exists()) { enterLobby(rc); return; }
    } catch (e) {}
    try { localStorage.removeItem(RK); } catch (e) {}
  }
  renderHome();
})();
